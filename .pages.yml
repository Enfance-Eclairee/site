media: img/uploads

content:
  - name: blog
    label: Articles du blog
    type: collection
    path: content/blog
    fields:
      - name: title
        label: Titre de l'article
        type: string
      - name: description
        label: Résumé (affiché sur la carte)
        type: text
      - name: date
        label: Date de publication
        type: date
      - name: tag
        label: Catégorie
        type: string
      - name: couleur
        label: Couleur du badge (sauge, ocre ou rose)
        type: select
        options:
          values: [sauge, ocre, rose]
      - name: image
        label: Photo de l'article
        type: image
      - name: alt
        label: Description de la photo
        type: string
      - name: body
        label: Texte de l'article
        type: rich-text
