media:
  input: img/uploads
  output: img/uploads

content:
  - name: blog
    label: Articles du blog
    type: collection
    path: content/blog
    view:
      fields: [title, date, tag]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre de l'article
        type: string
        required: true
      - name: description
        label: Résumé (2 phrases max, affiché sur la carte)
        type: text
        required: true
      - name: date
        label: Date de publication
        type: date
        required: true
      - name: tag
        label: Catégorie (Éveil, Bébé, Émotions, Formations…)
        type: string
        required: true
      - name: couleur
        label: Couleur du badge
        type: select
        default: sauge
        options:
          values:
            - value: sauge
              label: Vert sauge
            - value: ocre
              label: Ocre doré
            - value: rose
              label: Rose
      - name: image
        label: Photo de l'article
        type: image
        required: true
      - name: alt
        label: Description de la photo (pour Google)
        type: string
      - name: body
        label: Texte de l'article
        type: rich-text
